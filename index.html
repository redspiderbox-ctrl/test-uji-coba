<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stock Opname</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>
    <style>
        :root {
            --bg: #0f1117;
            --card: #1a1d27;
            --card2: #222632;
            --border: #2e3345;
            --fg: #e8eaf0;
            --muted: #7a8199;
            --accent: #00d48a;
            --accent-dim: rgba(0,212,138,0.12);
            --danger: #ff4d6a;
            --warn: #ffb340;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed; top: 16px; right: 16px; z-index: 9999;
            display: flex; flex-direction: column; gap: 8px;
        }
        .toast {
            padding: 12px 20px; border-radius: 10px; font-size: 14px;
            font-weight: 600; color: #fff; animation: slideIn .3s ease;
            box-shadow: 0 8px 24px rgba(0,0,0,.4);
        }
        .toast.success { background: var(--accent); color: #0f1117; }
        .toast.error { background: var(--danger); }
        .toast.info { background: #3b82f6; }
        @keyframes slideIn { from { transform: translateX(100%); opacity:0; } to { transform: translateX(0); opacity:1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity:1; } to { transform: translateX(100%); opacity:0; } }

        /* ===== HEADER ===== */
        .header {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            position: sticky; top: 0; z-index: 100;
        }
        .header-top {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px;
        }
        .header h1 {
            font-size: 20px; font-weight: 700;
            display: flex; align-items: center; gap: 10px;
        }
        .header h1 i { color: var(--accent); }
        .badge-count {
            background: var(--accent); color: #0f1117;
            font-size: 11px; font-weight: 700;
            padding: 2px 8px; border-radius: 20px;
        }
        .btn-sync {
            background: var(--accent-dim); color: var(--accent);
            border: 1px solid rgba(0,212,138,.3);
            padding: 8px 16px; border-radius: 8px;
            font-size: 13px; font-weight: 600; cursor: pointer;
            font-family: inherit; display: flex; align-items: center; gap: 6px;
            transition: all .2s;
        }
        .btn-sync:hover { background: var(--accent); color: #0f1117; }
        .btn-sync.loading { opacity: .6; pointer-events: none; }

        /* ===== API CONFIG BAR ===== */
        .api-bar {
            display: flex; gap: 8px; align-items: center;
        }
        .api-bar input {
            flex: 1; background: var(--bg); border: 1px solid var(--border);
            color: var(--fg); padding: 8px 12px; border-radius: 8px;
            font-size: 12px; font-family: monospace;
            outline: none; transition: border .2s;
        }
        .api-bar input:focus { border-color: var(--accent); }
        .api-bar input::placeholder { color: var(--muted); }
        .btn-save-api {
            background: var(--card2); color: var(--accent);
            border: 1px solid var(--border); padding: 8px 14px;
            border-radius: 8px; font-size: 13px; cursor: pointer;
            font-family: inherit; font-weight: 600; white-space: nowrap;
            transition: all .2s;
        }
        .btn-save-api:hover { border-color: var(--accent); }

        /* ===== MAIN LAYOUT ===== */
        .main { padding: 16px 20px 100px; max-width: 600px; margin: 0 auto; }

        /* ===== SCAN SECTION ===== */
        .scan-section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px; overflow: hidden;
            margin-bottom: 16px;
        }
        .scan-toggle {
            width: 100%; padding: 14px 20px;
            background: transparent; border: none; color: var(--fg);
            font-family: inherit; font-size: 15px; font-weight: 600;
            cursor: pointer; display: flex; align-items: center;
            justify-content: space-between;
        }
        .scan-toggle i { color: var(--accent); transition: transform .3s; }
        .scan-toggle.active i { transform: rotate(180deg); }

        .scanner-body {
            max-height: 0; overflow: hidden; transition: max-height .4s ease;
        }
        .scanner-body.open { max-height: 400px; }

        .scanner-wrapper {
            position: relative; width: 100%; height: 280px;
            background: #000;
        }
        .scanner-wrapper video, .scanner-wrapper canvas {
            width: 100% !important; height: 100% !important;
            object-fit: cover;
        }
        .scanner-overlay {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
        }
        .scan-frame {
            width: 220px; height: 140px;
            border: 2px solid var(--accent);
            border-radius: 12px; position: relative;
            box-shadow: 0 0 30px rgba(0,212,138,.15);
        }
        .scan-frame::before {
            content: ''; position: absolute; top: 50%; left: 10%; right: 10%;
            height: 2px; background: var(--accent);
            animation: scanLine 2s ease-in-out infinite;
            box-shadow: 0 0 12px var(--accent);
        }
        @keyframes scanLine {
            0%, 100% { top: 10%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            50% { top: 85%; }
        }
        .scan-hint {
            position: absolute; bottom: 12px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,.7); color: var(--muted);
            font-size: 11px; padding: 4px 12px; border-radius: 20px;
        }
        .scanner-placeholder {
            height: 280px; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: var(--muted); gap: 10px; background: var(--bg);
        }
        .scanner-placeholder i { font-size: 40px; opacity: .4; }

        /* ===== MANUAL INPUT ===== */
        .manual-input {
            display: flex; gap: 8px; padding: 12px 16px;
            border-top: 1px solid var(--border);
        }
        .manual-input input {
            flex: 1; background: var(--bg); border: 1px solid var(--border);
            color: var(--fg); padding: 10px 14px; border-radius: 8px;
            font-size: 14px; font-family: 'Space Grotesk', monospace;
            outline: none; transition: border .2s;
        }
        .manual-input input:focus { border-color: var(--accent); }
        .manual-input input::placeholder { color: var(--muted); }
        .btn-search {
            background: var(--accent); color: #0f1117; border: none;
            padding: 10px 18px; border-radius: 8px; font-size: 14px;
            font-weight: 700; cursor: pointer; font-family: inherit;
            transition: all .2s;
        }
        .btn-search:hover { opacity: .85; }

        /* ===== ITEM CARD (setelah scan) ===== */
        .item-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px; padding: 20px;
            margin-bottom: 16px;
            animation: fadeUp .3s ease;
            display: none;
        }
        .item-card.show { display: block; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

        .item-card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .item-card .value { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
        .item-card .value.accent { color: var(--accent); }

        .qty-control {
            display: flex; align-items: center; gap: 16px;
        }
        .qty-btn {
            width: 48px; height: 48px; border-radius: 12px;
            border: 1px solid var(--border); background: var(--card2);
            color: var(--fg); font-size: 22px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all .15s; font-family: inherit;
        }
        .qty-btn:hover { border-color: var(--accent); color: var(--accent); }
        .qty-btn:active { transform: scale(.92); }
        .qty-display {
            font-size: 32px; font-weight: 700; min-width: 80px;
            text-align: center; color: var(--accent);
        }
        .qty-input-row {
            display: flex; gap: 8px; margin-top: 12px; align-items: center;
        }
        .qty-input-row input {
            flex: 1; background: var(--bg); border: 1px solid var(--border);
            color: var(--fg); padding: 10px 14px; border-radius: 8px;
            font-size: 16px; text-align: center; font-family: inherit;
            outline: none;
        }
        .qty-input-row input:focus { border-color: var(--accent); }
        .btn-submit {
            flex: 1; background: var(--accent); color: #0f1117;
            border: none; padding: 12px; border-radius: 10px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            font-family: inherit; transition: all .15s;
        }
        .btn-submit:hover { opacity: .85; }
        .btn-submit:active { transform: scale(.97); }

        /* ===== LOG TABLE ===== */
        .log-section { margin-top: 8px; }
        .log-section h3 {
            font-size: 14px; color: var(--muted); margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }
        .log-table {
            width: 100%; border-collapse: collapse;
        }
        .log-table thead th {
            font-size: 11px; color: var(--muted); text-transform: uppercase;
            letter-spacing: .5px; padding: 10px 12px; text-align: left;
            border-bottom: 1px solid var(--border); font-weight: 600;
        }
        .log-table tbody tr {
            border-bottom: 1px solid var(--border);
            animation: fadeUp .25s ease;
        }
        .log-table tbody td {
            padding: 12px; font-size: 13px; vertical-align: middle;
        }
        .log-table .barcode-cell {
            font-family: monospace; font-weight: 600; color: var(--accent);
        }
        .log-table .qty-cell { font-weight: 700; font-size: 15px; }
        .log-table .time-cell { color: var(--muted); font-size: 11px; }
        .btn-delete-row {
            background: transparent; border: none; color: var(--danger);
            cursor: pointer; font-size: 14px; padding: 4px 8px;
            border-radius: 6px; transition: background .2s;
        }
        .btn-delete-row:hover { background: rgba(255,77,106,.12); }

        .empty-state {
            text-align: center; padding: 40px 20px; color: var(--muted);
        }
        .empty-state i { font-size: 36px; opacity: .3; margin-bottom: 12px; display: block; }
        .empty-state p { font-size: 13px; }

        /* ===== FOOTER NAV ===== */
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--card); border-top: 1px solid var(--border);
            padding: 12px 20px; display: flex; gap: 10px;
            z-index: 100;
        }
        .bottom-bar .btn-clear {
            flex: 1; background: transparent; color: var(--danger);
            border: 1px solid rgba(255,77,106,.3); padding: 12px;
            border-radius: 10px; font-size: 13px; font-weight: 600;
            cursor: pointer; font-family: inherit; transition: all .2s;
        }
        .bottom-bar .btn-clear:hover { background: rgba(255,77,106,.1); }
        .bottom-bar .btn-send-all {
            flex: 2; background: var(--accent); color: #0f1117;
            border: none; padding: 12px; border-radius: 10px;
            font-size: 14px; font-weight: 700; cursor: pointer;
            font-family: inherit; transition: all .2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .bottom-bar .btn-send-all:hover { opacity: .85; }
        .bottom-bar .btn-send-all:disabled { opacity: .4; pointer-events: none; }

        /* ===== RESPONSIVE ===== */
        @media (min-width: 700px) {
            .main { max-width: 560px; }
        }

        /* ===== PULSE DOT ===== */
        .pulse-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent); display: inline-block;
            animation: pulse 1.5s ease infinite;
        }
        .pulse-dot.off { background: var(--muted); animation: none; }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0,212,138,.5); }
            50% { box-shadow: 0 0 0 6px rgba(0,212,138,0); }
        }

        .flash-success {
            animation: flash .4s ease;
        }
        @keyframes flash {
            0% { box-shadow: 0 0 0 0 rgba(0,212,138,.6); }
            100% { box-shadow: 0 0 40px 10px rgba(0,212,138,0); }
        }
    </style>
</head>
<body>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Header -->
<header class="header">
    <div class="header-top">
        <h1>
            <i class="fa-solid fa-boxes-stacked"></i>
            Stock Opname
            <span class="badge-count" id="logCount">0</span>
        </h1>
        <div style="display:flex;align-items:center;gap:10px;">
            <span class="pulse-dot off" id="apiDot"></span>
            <button class="btn-sync" id="btnSync" onclick="fetchSheetData()">
                <i class="fa-solid fa-rotate"></i> Sync
            </button>
        </div>
    </div>
    <!-- API URL Config -->
    <div class="api-bar">
        <input type="text" id="apiUrlInput" placeholder="Paste Google Sheet API URL di sini...">
        <button class="btn-save-api" onclick="saveApiUrl()">
            <i class="fa-solid fa-floppy-disk"></i> Simpan
        </button>
    </div>
</header>

<!-- Main Content -->
<main class="main">

    <!-- Scanner Section -->
    <section class="scan-section">
        <button class="scan-toggle" id="scanToggle" onclick="toggleScanner()">
            <span><i class="fa-solid fa-barcode" style="margin-right:8px;"></i> Camera Scanner</span>
            <i class="fa-solid fa-chevron-down"></i>
        </button>
        <div class="scanner-body" id="scannerBody">
            <div class="scanner-wrapper" id="scannerWrapper" style="display:none;">
                <div id="scannerContainer"></div>
                <div class="scanner-overlay">
                    <div class="scan-frame"></div>
                </div>
                <div class="scan-hint">Arahkan barcode ke frame</div>
            </div>
            <div class="scanner-placeholder" id="scannerPlaceholder">
                <i class="fa-solid fa-camera"></i>
                <p>Klik tombol di atas untuk membuka kamera</p>
            </div>
        </div>
        <div class="manual-input">
            <input type="text" id="manualBarcode" placeholder="Ketik barcode manual..." 
                   onkeydown="if(event.key==='Enter')searchBarcode()">
            <button class="btn-search" onclick="searchBarcode()">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
    </section>

    <!-- Item Card (muncul setelah scan/success) -->
    <section class="item-card" id="itemCard">
        <div class="label">Barcode</div>
        <div class="value" id="itemBarcode">-</div>
        <div class="label">Nama Barang</div>
        <div class="value accent" id="itemName">-</div>
        <div class="label">Jumlah Dihitung</div>
        <div class="qty-control">
            <button class="qty-btn" onclick="changeQty(-1)">-</button>
            <div class="qty-display" id="qtyDisplay">1</div>
            <button class="qty-btn" onclick="changeQty(1)">+</button>
        </div>
        <div class="qty-input-row">
            <input type="number" id="qtyInput" value="1" min="0" 
                   oninput="syncQtyFromInput()">
            <button class="btn-submit" onclick="submitItem()">
                <i class="fa-solid fa-plus"></i> Tambah
            </button>
        </div>
    </section>

    <!-- Log Table -->
    <section class="log-section">
        <h3><i class="fa-solid fa-list-check"></i> Data Opname Hari Ini</h3>
        <div id="logContent">
            <div class="empty-state" id="emptyState">
                <i class="fa-solid fa-inbox"></i>
                <p>Belum ada data. Scan atau ketik barcode untuk memulai.</p>
            </div>
            <table class="log-table" id="logTable" style="display:none;">
                <thead>
                    <tr>
                        <th>Barcode</th>
                        <th>Nama</th>
                        <th>Qty</th>
                        <th>Waktu</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="logBody"></tbody>
            </table>
        </div>
    </section>
</main>

<!-- Bottom Bar -->
<footer class="bottom-bar">
    <button class="btn-clear" onclick="clearLog()">
        <i class="fa-solid fa-trash-can"></i> Hapus Semua
    </button>
    <button class="btn-send-all" id="btnSendAll" onclick="sendToSheet()" disabled>
        <i class="fa-solid fa-paper-plane"></i> Kirim ke Google Sheet
    </button>
</footer>

<script>
    // ===== STATE =====
    let apiUrl = localStorage.getItem('stockOpname_apiUrl') || '';
    let sheetData = {};        // cache: barcode => nama barang
    let opnameLog = [];        // array { barcode, nama, qty, waktu }
    let currentQty = 1;
    let currentBarcode = '';
    let scannerActive = false;
    let quaggaInitialized = false;

    // ===== INIT =====
    document.addEventListener('DOMContentLoaded', () => {
        // Muat API URL dari localStorage
        if (apiUrl) {
            document.getElementById('apiUrlInput').value = apiUrl;
            document.getElementById('apiDot').classList.remove('off');
            fetchSheetData();
        }
        // Muat log dari sessionStorage (reset per sesi)
        renderLog();
    });

    // ===== TOAST =====
    function showToast(msg, type = 'info') {
        const container = document.getElementById('toastContainer');
        const t = document.createElement('div');
        t.className = `toast ${type}`;
        t.textContent = msg;
        container.appendChild(t);
        setTimeout(() => {
            t.style.animation = 'slideOut .3s ease forwards';
            setTimeout(() => t.remove(), 300);
        }, 2500);
    }

    // ===== API URL =====
    function saveApiUrl() {
        const input = document.getElementById('apiUrlInput').value.trim();
        if (!input) {
            showToast('Masukkan URL API terlebih dahulu', 'error');
            return;
        }
        // Validasi format URL Google Sheet publik
        if (!input.includes('docs.google.com/spreadsheets') && !input.startsWith('https://')) {
            showToast('URL tidak valid', 'error');
            return;
        }
        apiUrl = input;
        localStorage.setItem('stockOpname_apiUrl', apiUrl);
        document.getElementById('apiDot').classList.remove('off');
        showToast('API URL tersimpan', 'success');
        fetchSheetData();
    }

    // ===== FETCH SHEET DATA =====
    async function fetchSheetData() {
        if (!apiUrl) {
            showToast('Set API URL terlebih dahulu', 'error');
            return;
        }

        const btn = document.getElementById('btnSync');
        btn.classList.add('loading');
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Syncing...';

        try {
            // Konversi URL edit ke URL export CSV
            let csvUrl = apiUrl;
            
            // Jika URL masih format edit, konversi ke format publik/export
            if (csvUrl.includes('/edit')) {
                // Ekstrak ID dari URL
                const idMatch = csvUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (idMatch) {
                    const sheetId = idMatch[1];
                    // Ambil gid jika ada
                    const gidMatch = csvUrl.match(/gid=(\d+)/);
                    const gid = gidMatch ? gidMatch[1] : '0';
                    csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}`;
                }
            }

            const response = await fetch(csvUrl);
            if (!response.ok) throw new Error('Gagal mengakses sheet. Pastikan sheet sudah dipublikasikan.');

            const csvText = await response.text();
            parseCSV(csvText);

            document.getElementById('apiDot').classList.remove('off');
            showToast(`Berhasil memuat ${Object.keys(sheetData).length} item`, 'success');
        } catch (err) {
            console.error(err);
            showToast(err.message || 'Gagal sync data', 'error');
            document.getElementById('apiDot').classList.add('off');
        } finally {
            btn.classList.remove('loading');
            btn.innerHTML = '<i class="fa-solid fa-rotate"></i> Sync';
        }
    }

    // ===== PARSE CSV =====
    function parseCSV(csv) {
        sheetData = {};
        const lines = csv.split('\n').filter(l => l.trim());
        if (lines.length < 2) return;

        // Deteksi header - cari kolom barcode dan nama
        const header = lines[0].split(',').map(h => h.trim().toLowerCase());
        let barcodeIdx = header.findIndex(h => h.includes('barcode') || h.includes('kode') || h.includes('code'));
        let namaIdx = header.findIndex(h => h.includes('nama') || h.includes('name') || h.includes('barang') || h.includes('item'));

        // Fallback: kolom 0 = barcode, kolom 1 = nama
        if (barcodeIdx === -1) barcodeIdx = 0;
        if (namaIdx === -1) namaIdx = 1;

        for (let i = 1; i < lines.length; i++) {
            const cols = parseCSVLine(lines[i]);
            if (cols[barcodeIdx] && cols[namaIdx]) {
                sheetData[cols[barcodeIdx].trim()] = cols[namaIdx].trim();
            }
        }
    }

    // Parse CSV line yang mungkin mengandung koma di dalam quote
    function parseCSVLine(line) {
        const result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (ch === '"') {
                inQuotes = !inQuotes;
            } else if (ch === ',' && !inQuotes) {
                result.push(current);
                current = '';
            } else {
                current += ch;
            }
        }
        result.push(current);
        return result;
    }

    // ===== SCANNER TOGGLE =====
    function toggleScanner() {
        const toggle = document.getElementById('scanToggle');
        const body = document.getElementById('scannerBody');
        const wrapper = document.getElementById('scannerWrapper');
        const placeholder = document.getElementById('scannerPlaceholder');

        if (!scannerActive) {
            body.classList.add('open');
            toggle.classList.add('active');
            scannerActive = true;
            startScanner();
        } else {
            body.classList.remove('open');
            toggle.classList.remove('active');
            scannerActive = false;
            stopScanner();
        }
    }

    // ===== QUAGGA SCANNER =====
    function startScanner() {
        const wrapper = document.getElementById('scannerWrapper');
        const placeholder = document.getElementById('scannerPlaceholder');
        const container = document.getElementById('scannerContainer');

        if (quaggaInitialized) {
            Quagga.start();
            wrapper.style.display = 'block';
            placeholder.style.display = 'none';
            return;
        }

        Quagga.init({
            inputStream: {
                name: "Live",
                type: "LiveStream",
                target: container,
                constraints: {
                    facingMode: "environment",
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                frequency: 10
            },
            decoder: {
                readers: [
                    "code_128_reader",
                    "ean_reader",
                    "ean_8_reader",
                    "code_39_reader",
                    "upc_reader",
                    "upc_e_reader",
                    "codabar_reader"
                ],
                multiple: false
            },
            locate: true,
            locator: {
                patchSize: "medium",
                halfSample: true
            }
        }, function(err) {
            if (err) {
                console.error(err);
                showToast('Gagal mengakses kamera. Pastikan izin kamera diberikan.', 'error');
                wrapper.style.display = 'none';
                placeholder.style.display = 'flex';
                placeholder.innerHTML = '<i class="fa-solid fa-camera-slash" style="font-size:40px;opacity:.4;"></i><p>Gagal akses kamera. Coba refresh halaman.</p>';
                return;
            }

            quaggaInitialized = true;
            Quagga.start();
            wrapper.style.display = 'block';
            placeholder.style.display = 'none';

            Quagga.onDetected(onBarcodeDetected);
        });
    }

    function stopScanner() {
        if (quaggaInitialized) {
            Quagga.offDetected(onBarcodeDetected);
            Quagga.stop();
        }
        document.getElementById('scannerWrapper').style.display = 'none';
        document.getElementById('scannerPlaceholder').style.display = 'flex';
    }

    function onBarcodeDetected(result) {
        if (result && result.codeResult && result.codeResult.code) {
            const code = result.codeResult.code;
            // Vibrate sebagai feedback
            if (navigator.vibrate) navigator.vibrate(100);
            
            // Flash effect
            const wrapper = document.getElementById('scannerWrapper');
            wrapper.classList.add('flash-success');
            setTimeout(() => wrapper.classList.remove('flash-success'), 400);

            handleBarcode(code);
        }
    }

    // ===== MANUAL SEARCH =====
    function searchBarcode() {
        const input = document.getElementById('manualBarcode');
        const code = input.value.trim();
        if (!code) {
            showToast('Masukkan kode barcode', 'error');
            return;
        }
        handleBarcode(code);
        input.value = '';
    }

    // ===== HANDLE BARCODE =====
    function handleBarcode(code) {
        currentBarcode = code;
        currentQty = 1;

        // Cari di data sheet
        const nama = sheetData[code] || 'Tidak ditemukan di database';

        // Tampilkan item card
        document.getElementById('itemBarcode').textContent = code;
        document.getElementById('itemName').textContent = nama;
        document.getElementById('qtyDisplay').textContent = '1';
        document.getElementById('qtyInput').value = 1;

        const card = document.getElementById('itemCard');
        card.classList.add('show');
        card.classList.remove('flash-success');
        void card.offsetWidth; // reflow
        card.classList.add('flash-success');

        // Scroll ke item card
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });

        if (nama === 'Tidak ditemukan di database') {
            showToast(`Barcode "${code}" tidak ada di sheet`, 'error');
        } else {
            showToast(`Ditemukan: ${nama}`, 'success');
        }
    }

    // ===== QTY CONTROL =====
    function changeQty(delta) {
        currentQty = Math.max(0, currentQty + delta);
        document.getElementById('qtyDisplay').textContent = currentQty;
        document.getElementById('qtyInput').value = currentQty;
    }

    function syncQtyFromInput() {
        const val = parseInt(document.getElementById('qtyInput').value) || 0;
        currentQty = Math.max(0, val);
        document.getElementById('qtyDisplay').textContent = currentQty;
    }

    // ===== SUBMIT ITEM =====
    function submitItem() {
        if (!currentBarcode) return;

        const nama = sheetData[currentBarcode] || 'Tidak ditemukan';
        const now = new Date();
        const waktu = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        // Cek apakah barcode sudah ada di log, kalau ya update qty
        const existing = opnameLog.find(l => l.barcode === currentBarcode);
        if (existing) {
            existing.qty = currentQty;
            existing.waktu = waktu;
            showToast(`Update ${nama} -> qty ${currentQty}`, 'info');
        } else {
            opnameLog.push({ barcode: currentBarcode, nama, qty: currentQty, waktu });
            showToast(`Ditambahkan: ${nama} x${currentQty}`, 'success');
        }

        // Sembunyikan item card
        document.getElementById('itemCard').classList.remove('show');
        currentBarcode = '';

        renderLog();

        // Vibrate feedback
        if (navigator.vibrate) navigator.vibrate([50, 30, 50]);
    }

    // ===== RENDER LOG =====
    function renderLog() {
        const empty = document.getElementById('emptyState');
        const table = document.getElementById('logTable');
        const body = document.getElementById('logBody');
        const count = document.getElementById('logCount');
        const btnSend = document.getElementById('btnSendAll');

        count.textContent = opnameLog.length;
        btnSend.disabled = opnameLog.length === 0;

        if (opnameLog.length === 0) {
            empty.style.display = 'block';
            table.style.display = 'none';
            return;
        }

        empty.style.display = 'none';
        table.style.display = 'table';

        body.innerHTML = opnameLog.map((item, i) => `
            <tr>
                <td class="barcode-cell">${item.barcode}</td>
                <td>${item.nama}</td>
                <td class="qty-cell">${item.qty}</td>
                <td class="time-cell">${item.waktu}</td>
                <td><button class="btn-delete-row" onclick="deleteRow(${i})"><i class="fa-solid fa-xmark"></i></button></td>
            </tr>
        `).join('');
    }

    // ===== DELETE ROW =====
    function deleteRow(index) {
        opnameLog.splice(index, 1);
        renderLog();
        showToast('Data dihapus', 'info');
    }

    // ===== CLEAR LOG =====
    function clearLog() {
        if (opnameLog.length === 0) return;
        opnameLog = [];
        renderLog();
        showToast('Semua data dihapus', 'info');
    }

    // ===== SEND TO GOOGLE SHEET =====
    async function sendToSheet() {
        if (opnameLog.length === 0) return;
        if (!apiUrl) {
            showToast('Set API URL terlebih dahulu', 'error');
            return;
        }

        const btn = document.getElementById('btnSendAll');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengirim...';

        try {
            // Gunakan Google Apps Script Web App endpoint
            // Format kirim: POST ke URL dengan JSON body
            const payload = {
                data: opnameLog.map(item => ({
                    barcode: item.barcode,
                    nama: item.nama,
                    qty: item.qty,
                    waktu: item.waktu,
                    tanggal: new Date().toLocaleDateString('id-ID')
                }))
            };

            // Coba kirim ke URL yang diset (harus Google Apps Script Web App)
            const response = await fetch(apiUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            // Karena no-cors, kita tidak bisa baca response
            // Tapi kalau tidak throw error, biasanya berhasil
            showToast(`${opnameLog.length} data berhasil dikirim!`, 'success');
            opnameLog = [];
            renderLog();

        } catch (err) {
            console.error(err);
            showToast('Gagal mengirim. Pastikan URL adalah Google Apps Script Web App.', 'error');
        } finally {
            btn.disabled = opnameLog.length === 0;
            btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Kirim ke Google Sheet';
        }
    }
</script>

</body>
</html>
